<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Iron Log</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05050c; --panel:rgba(9,17,32,.78); --panel2:rgba(9,17,32,.55);
    --ink:#eef2ff; --ink2:#b9c2e0; --mut:#6e7ba8; --mut2:#4f5680; --dim:#3f4870;
    --magenta:#ff2d95;
    --accent:#00e5ff; --a08:rgba(0,229,255,.08); --a20:rgba(0,229,255,.20);
    --a30:rgba(0,229,255,.30); --a55:rgba(0,229,255,.55);
    --pad:max(16px, env(safe-area-inset-left));
    --mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;overflow-x:hidden}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}

  /* backdrop */
  .glow{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(120% 55% at 15% 0%,rgba(0,229,255,.16),transparent 60%),
               radial-gradient(110% 50% at 95% 6%,rgba(255,45,149,.13),transparent 60%)}
  .horizon{position:fixed;left:-60%;right:-60%;bottom:-30px;height:240px;z-index:0;pointer-events:none;opacity:.3;
    background:repeating-linear-gradient(90deg,var(--a30) 0 1px,transparent 1px 42px),
               repeating-linear-gradient(0deg,var(--a30) 0 1px,transparent 1px 26px);
    transform:perspective(280px) rotateX(74deg);transform-origin:bottom center}
  .scan{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
  .wrap{position:relative;z-index:2;padding-bottom:120px}

  /* header */
  header{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 16px) var(--pad) 8px;
    background:linear-gradient(180deg,var(--bg) 72%,transparent)}
  .top{display:flex;align-items:center;gap:9px}
  .dot{width:8px;height:8px;border-radius:1px;background:var(--magenta);box-shadow:0 0 12px var(--magenta)}
  .brand{font-family:Michroma,sans-serif;font-size:9.5px;letter-spacing:.32em;color:#7f86b8}
  .navrow{margin-left:auto;display:flex;gap:6px}
  .nav{width:38px;height:34px;border-radius:9px;border:1px solid rgba(120,140,200,.2);
    display:flex;align-items:center;justify-content:center;color:var(--mut);transition:.15s}
  .nav.on{border-color:var(--a55);color:var(--accent);background:var(--a08);
    box-shadow:0 0 16px rgba(0,229,255,.2)}
  .nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  h1.title{font-family:Michroma,sans-serif;font-size:23px;line-height:1.18;margin:14px 0 6px;
    color:#eafcff;text-shadow:0 0 22px rgba(0,229,255,.7),0 0 46px rgba(0,229,255,.3)}
  .sub{font:500 10px/1 var(--mono);letter-spacing:.14em;color:var(--mut2);min-height:12px}
  .vol{margin-left:auto;font:600 9.5px/1 var(--mono);letter-spacing:.16em;color:var(--mut2)}

  /* day pills */
  .days{display:flex;gap:8px;overflow-x:auto;padding:12px var(--pad) 6px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto;padding:8px 15px;border-radius:999px;background:none;
    border:1px solid rgba(120,140,200,.24);color:var(--mut);font:600 12px Inter,sans-serif;
    letter-spacing:.04em;white-space:nowrap;transition:.15s}
  .pill.on{border-color:transparent;color:#04121a;font-weight:700}

  main{padding:8px var(--pad) 0}

  /* exercise card */
  .card{position:relative;border-radius:15px;padding:15px 15px 13px;margin:13px 0;overflow:hidden;
    background:linear-gradient(165deg,rgba(9,17,32,.92),rgba(6,8,18,.92));
    border:1px solid var(--a20)}
  .card.live{border-color:var(--a30);box-shadow:0 0 28px rgba(0,229,255,.1),inset 0 1px 0 rgba(255,255,255,.05)}
  .edge{position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--accent),var(--magenta))}
  .ex-top{display:flex;align-items:baseline;gap:9px}
  .ex-idx{font-family:Michroma,sans-serif;font-size:10px;color:var(--accent);text-shadow:0 0 12px var(--a55)}
  .ex-name{font:700 16.5px/1.2 Inter,sans-serif;letter-spacing:-.01em;color:#f2f6ff}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 13px}
  .chip{font:600 10px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;
    color:var(--mut);border:1px solid rgba(120,140,200,.22);padding:4px 8px;border-radius:6px}
  .chip.hot{color:#8ce9ff;border-color:var(--a30);background:var(--a08)}

  .sets{display:flex;flex-direction:column;gap:8px}
  .set{display:grid;grid-template-columns:26px 1fr 12px 1fr 42px;align-items:center;gap:8px}
  .set .n{font-family:Michroma,sans-serif;font-size:9px;color:var(--dim)}
  .set input{width:100%;min-width:0;background:rgba(0,229,255,.05);border:1px solid var(--a20);
    color:#eafcff;border-radius:9px;padding:10px 6px;text-align:center;
    font:700 17px Inter,sans-serif;font-variant-numeric:tabular-nums}
  .set input:focus{outline:none;border-color:var(--a55);box-shadow:0 0 16px rgba(0,229,255,.2)}
  .set input::placeholder{color:var(--dim);font-weight:500}
  .set .x{text-align:center;font-size:12px;color:var(--dim)}
  .set .done{width:42px;height:42px;border-radius:9px;border:1px solid var(--a30);
    background:rgba(0,229,255,.04);display:flex;align-items:center;justify-content:center;
    font:800 17px Inter,sans-serif;color:transparent;transition:.14s}
  .set .done.on{background:var(--accent);border-color:transparent;color:#04121a;
    box-shadow:0 0 20px var(--a55)}
  .set.off input{opacity:.55}
  .setctl{display:flex;gap:18px;margin-top:12px}
  .setctl button{font:600 11.5px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase}
  .setctl .add{color:var(--magenta)}
  .setctl .del{color:var(--mut2)}

  /* bottom bar */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:10px;
    padding:14px var(--pad) calc(env(safe-area-inset-bottom) + 16px);
    background:linear-gradient(0deg,var(--bg) 58%,transparent)}
  .bar button{padding:15px;border-radius:12px;font:700 13px Inter,sans-serif;
    letter-spacing:.09em;text-transform:uppercase;transition:.12s}
  .btn-rest{flex:0 0 44%;background:rgba(255,45,149,.08);border:1px solid rgba(255,45,149,.45);color:#ff77b8}
  .btn-save{flex:1;background:linear-gradient(100deg,var(--magenta),var(--accent));color:#04121a;
    font-weight:800;box-shadow:0 0 26px rgba(255,45,149,.4)}
  .bar button:active{transform:scale(.98)}

  /* section headers */
  .shead{font-family:Michroma,sans-serif;font-size:10px;letter-spacing:.22em;color:var(--mut2);margin:26px 0 12px}

  /* history */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:18px}
  .cal .wd{font:600 8.5px var(--mono);color:var(--dim);text-align:center}
  .cell{aspect-ratio:1;border-radius:7px;background:rgba(255,255,255,.03)}
  .cell.today{border:1.5px solid var(--accent);box-shadow:0 0 16px rgba(0,229,255,.5)}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
  .legend span{display:flex;align-items:center;gap:6px;font:600 9px var(--mono);letter-spacing:.1em;color:var(--mut2)}
  .legend i{width:8px;height:8px;border-radius:2px;display:block}
  .srow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;
    background:var(--panel);border:1px solid rgba(255,255,255,.07);margin-bottom:9px}
  .srow .tag{width:3px;height:34px;border-radius:2px}
  .srow .nm{font:700 13.5px Inter,sans-serif;color:#f2f6ff}
  .srow .mt{font:500 9.5px var(--mono);letter-spacing:.12em;color:var(--mut2);margin-top:3px}
  .srow .rt{text-align:right}
  .srow .rt b{font:800 15px Inter,sans-serif;color:#b9c2e0;font-variant-numeric:tabular-nums;display:block}
  .srow .rt s{font:600 8.5px var(--mono);color:var(--mut2);text-decoration:none}

  .stats{display:flex;gap:9px;margin-top:14px}
  .stat{flex:1;padding:12px;border-radius:11px;background:var(--panel);border:1px solid rgba(255,255,255,.07)}
  .stat b{font:800 16px Inter,sans-serif;color:#f2f6ff;font-variant-numeric:tabular-nums;display:block}
  .stat s{font:600 8.5px var(--mono);letter-spacing:.12em;color:var(--mut2);text-decoration:none;display:block;margin-top:4px}

  .chartbox{position:relative;margin-top:18px;border-radius:14px;border:1px solid var(--a20);
    background:linear-gradient(180deg,rgba(9,17,32,.75),rgba(5,5,12,.75));padding:14px 10px 10px;overflow:hidden}
  .xax{display:flex;justify-content:space-between;padding:0 6px;font:500 8.5px var(--mono);
    letter-spacing:.1em;color:var(--dim)}
  .hrow{display:flex;justify-content:space-between;padding:11px 14px;background:var(--panel2)}
  .hrow:first-child{background:var(--a08)}
  .hrow span{font:600 11.5px Inter,sans-serif;color:var(--mut)}
  .hrow b{font:700 12px Inter,sans-serif;color:var(--ink2);font-variant-numeric:tabular-nums}
  .hlist{display:flex;flex-direction:column;gap:1px;border-radius:11px;overflow:hidden;
    border:1px solid rgba(255,255,255,.07)}

  .empty{margin-top:40px;padding:34px 22px;border-radius:16px;text-align:center;
    border:1px dashed var(--a30);background:rgba(0,229,255,.03)}
  .empty h3{font-family:Michroma,sans-serif;font-size:12px;letter-spacing:.18em;color:#8ce9ff;
    margin:0 0 12px;text-shadow:0 0 18px rgba(0,229,255,.5)}
  .empty p{font:400 12.5px/1.7 Inter,sans-serif;color:var(--mut);margin:0;text-wrap:pretty}

  /* rest overlay */
  .veil{position:fixed;inset:0;z-index:50;background:rgba(4,4,10,.94);backdrop-filter:blur(8px);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:24px}
  .veil.show{display:flex}
  .veil .close{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:18px;
    font:600 11px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);padding:8px}
  .ring-wrap{position:relative;width:250px;height:250px;display:none}
  .ring-wrap.show{display:block}
  svg.ring{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 10px var(--a55))}
  .ring-bg{fill:none;stroke:rgba(120,140,200,.16);stroke-width:7}
  .ring-fg{fill:none;stroke:url(#ringgrad);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
  .ring-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .ring-time{font-family:Michroma,sans-serif;font-size:44px;line-height:1;color:#fff;
    font-variant-numeric:tabular-nums;text-shadow:0 0 26px rgba(0,229,255,.8),0 0 60px rgba(255,45,149,.45)}
  .ring-lbl{font:600 9.5px var(--mono);letter-spacing:.24em;color:var(--mut)}
  .presets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:330px}
  .preset{padding:10px 15px;border-radius:999px;border:1px solid var(--a20);color:#5d7f9c;
    font:600 12.5px Inter,sans-serif}
  .preset:active{border-color:var(--a55);color:#8ce9ff}
  .adj{display:none;gap:12px}
  .adj.show{display:flex}
  .adj button{padding:11px 17px;border-radius:10px;background:rgba(255,255,255,.04);
    border:1px solid rgba(120,140,200,.28);color:#c9d3f5;font:700 13px Inter,sans-serif}
  .adj button.stop{background:rgba(255,45,149,.12);border-color:rgba(255,45,149,.5);color:#ff77b8}
  .veil .hint{font:500 10px var(--mono);letter-spacing:.18em;color:var(--dim);text-align:center}

  .toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,20px);z-index:60;
    background:linear-gradient(100deg,var(--magenta),var(--accent));color:#04121a;
    font:800 12px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;
    padding:12px 20px;border-radius:11px;opacity:0;pointer-events:none;transition:.25s;
    box-shadow:0 0 30px rgba(255,45,149,.5)}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---- mobile readability boost (phones) ---- */
  @media (max-width:640px){
    h1.title{font-size:33px;line-height:1.12}
    .brand{font-size:12px}
    .sub{font-size:12px}
    .vol{font-size:11px}
    .nav{width:44px;height:40px}
    .nav svg{width:19px;height:19px}
    .pill{font-size:15px;padding:10px 17px}
    .ex-idx{font-size:13px}
    .ex-name{font-size:20px;line-height:1.22}
    .chip{font-size:12.5px;padding:5px 10px}
    .set{grid-template-columns:30px 1fr 14px 1fr 48px;gap:9px}
    .set .n{font-size:12px}
    .set input{font-size:20px;padding:13px 8px}
    .set .x{font-size:15px}
    .set .done{width:48px;height:48px;font-size:21px}
    .setctl{gap:22px;margin-top:14px}
    .setctl button{font-size:14px}
    .bar button{font-size:15px;padding:17px}
    .shead{font-size:13px}
    .empty h3{font-size:15px}
    .empty p{font-size:14.5px}
    .cal .wd{font-size:11px}
    .legend span{font-size:11.5px}
    .srow{padding:15px}
    .srow .nm{font-size:16px}
    .srow .mt{font-size:11px}
    .srow .rt b{font-size:18px}
    .srow .rt s{font-size:10.5px}
    .stat b{font-size:20px}
    .stat s{font-size:10.5px}
    .hrow span{font-size:14px}
    .hrow b{font-size:14px}
    .xax{font-size:10.5px}
    .preset{font-size:15px;padding:12px 18px}
    .ring-lbl{font-size:11px}
  }
</style>

<div class="glow"></div>
<div class="horizon"></div>
<div class="scan"></div>

<div class="wrap">
<header>
  <div class="top">
    <span class="dot"></span>
    <span class="brand">IRON LOG</span>
    <div class="navrow">
      <button class="nav on" data-view="log" aria-label="Log"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
      <button class="nav" data-view="hist" aria-label="Historie"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 3v3M16 3v3"/></svg></button>
      <button class="nav" data-view="prog" aria-label="Fortschritt"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M7.5 15l3.5-4 3 2.5L20 8"/></svg></button>
    </div>
  </div>
  <h1 class="title" id="title">–</h1>
  <div style="display:flex;align-items:baseline">
    <div class="sub" id="sub"></div>
    <div class="vol" id="volhead"></div>
  </div>
</header>

<nav class="days" id="days"></nav>
<main id="main"></main>
</div>

<div class="bar" id="bar">
  <button class="btn-rest" id="restBtn">⏱ Pause</button>
  <button class="btn-save" id="saveBtn">Einheit speichern</button>
</div>

<div class="veil" id="veil">
  <button class="close" id="restClose">Schließen</button>
  <div class="presets" id="presets"></div>
  <div class="ring-wrap" id="ringWrap">
    <svg class="ring" viewBox="0 0 120 120">
      <defs><linearGradient id="ringgrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ff2d95"/><stop offset="100%" stop-color="#00e5ff"/>
      </linearGradient></defs>
      <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
      <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52"></circle>
    </svg>
    <div class="ring-mid">
      <div class="ring-time" id="ringTime">0:00</div>
      <div class="ring-lbl" id="ringLbl">PAUSE LÄUFT</div>
    </div>
  </div>
  <div class="adj" id="ringAdj">
    <button data-adj="-15">−15s</button>
    <button data-adj="15">+15s</button>
    <button data-adj="stop" class="stop">Stopp</button>
  </div>
  <div class="hint" id="restHint">PAUSENZEIT WÄHLEN</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---------- plan data ----------
const P = (w,r)=>({w:w===null?"":String(w), r:r===null?"":String(r)});
const PLAN = {
  "Upper Body":{accent:"#00e5ff",exercises:[

    {name:"Pec Deck",wu:"1–2",sets:3,reps:"10–12",rest:"1–2",d:[P(80,10),P(80,10),P(75,12)]},
    {name:"Lat Pulldown",wu:"1–2",sets:3,reps:"10–12",rest:"2–3",d:[P(117,10),P(117,11),P(117,11)]},
    {name:"Dumbbell Lateral Raise",wu:"1–2",sets:2,reps:"10–12",rest:"1–2",d:[P(28,10),P(25,12)]},
    {name:"Machine Row",wu:"1–2",sets:3,reps:"8–10",rest:"2–3",d:[P(65,10),P(65,10),P(65,10)]},

  ]},
  "Lower Body":{accent:"#2dffb0",exercises:[
    {name:"Lying Leg Curl",wu:"2",sets:2,reps:"10–12",rest:"1–2",d:[P(75,10),P(75,10)]},
    {name:"Hack Squat",wu:"2–4",sets:3,reps:"8–10",rest:"3–5",d:[P(75,10),P(75,10),P(75,10)]},
    {name:"Hyperextension",wu:"2–4",sets:3,reps:"8–10",rest:"2–3",d:[P(15,14),P(20,11),P(15,15)]},
    {name:"Leg Extension",wu:"1–2",sets:3,reps:"8–10",rest:"1–2",d:[P(75,9),P(75,9),P(75,8)]},
    {name:"Crunch",wu:"1",sets:2,reps:"10–12",rest:"1–2",d:[P(80,14),P(10,15)]},

  "Push":{accent:"#ff9d2e",exercises:[
    {name:"Dumbbell Bench Press",wu:"2–4",sets:3,reps:"10–12",rest:"3–5",d:[P(40,10),P(40,10),P(38,11)]},
    {name:"Dumbbell Shoulder Press",wu:"2–3",sets:3,reps:"10–12",rest:"2–3",d:[P(30,11),P(30,11),P(30,9)]},

    {name:"Triceps Pushdown (bar)",wu:"1",sets:3,reps:"12–15",rest:"1–2",d:[P(70,15),P(70,14),P(70,14)]},
    {name:"Single-arm Triceps Pushdown",wu:"1",sets:2,reps:"15–20",rest:"1–2",d:[P(30,13)]},
    {name:"Leg Raise",wu:"1–2",sets:2,reps:"10–20",rest:"1–2",d:[P(null,14),P(null,12)]},
  ]},
  "Pull":{accent:"#b16cff",exercises:[
    {name:"Lat Pulldown (wide grip)",wu:"2–3",sets:3,reps:"10–12",rest:"2–3",d:[P(85,11),P(85,11),P(85,11)]},
    {name:"Machine Row",wu:"2–3",sets:3,reps:"10–12",rest:"2–3",d:[P(55,11),P(55,11),P(55,12)]},
    {name:"Seated Row",wu:"1–2",sets:2,reps:"12–15",rest:"2–3",d:[P(34,15),P(34,14)]},
    {name:"Rear Delt Fly",wu:"1–2",sets:3,reps:"12–15",rest:"1–2",d:[P(25,14),P(25,14),P(20,16)]},
    {name:"Shrug",wu:"2–3",sets:2,reps:"12–15",rest:"1–2",d:[P(85,23),P(85,20)]},
    {name:"Cable Hammer Curl (rope)",wu:"1",sets:3,reps:"12–15",rest:"1–2",d:[P(45,14),P(50,12),P(50,14)]},
    {name:"Bayesian Curl",wu:"1",sets:2,reps:"15–20",rest:"1–2",d:[P(25,15),P(20,14)]},
  ]},
  "Legs":{accent:"#ff3d6e",exercises:[
    {name:"Lying Leg Press",wu:"2–4",sets:3,reps:"10–12",rest:"2–3",d:[P(30,12),P(32.5,12),P(35,12)]},
    {name:"Seated Leg Curl",wu:"1–2",sets:3,reps:"12–15",rest:"1–2",d:[P(65,14),P(65,15),P(65,15)]},
    {name:"Leg Extension",wu:"1–2",sets:2,reps:"12–15",rest:"1–2",d:[P(55,14),P(55,13)]},
    {name:"Hip Adduction",wu:"1–2",sets:2,reps:"12–15",rest:"1–2",d:[P(65,16),P(70,17)]},
    {name:"Hip Abduction",wu:"1–2",sets:2,reps:"12–15",rest:"1–2",d:[P(70,13),P(70,12)]},
  ]},
};
const DAYS = Object.keys(PLAN);

// ---------- storage ----------
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
};
const keyLast = d=>"ironlog:last:"+d;
const keyDate = d=>"ironlog:date:"+d;
const KEY_HIST = "ironlog:hist";
function hist(){ try{ return JSON.parse(store.get(KEY_HIST)||"[]"); }catch(e){ return []; } }
function pushHist(entry){ const h=hist(); h.unshift(entry); store.set(KEY_HIST, JSON.stringify(h.slice(0,400))); }

const num = v => { const n=parseFloat(String(v).replace(",",".")); return isFinite(n)?n:0; };
const fmt = n => n.toLocaleString("de-DE",{maximumFractionDigits:1});
const deDate = iso => { const d=new Date(iso);
  return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear(); };

// ---------- state ----------
let view = "log";
let cur = DAYS[0];
let work = {};
let progEx = null;

function setAccent(hex){
  const rgb = h => { const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255].join(","); };
  const r = document.documentElement.style;
  r.setProperty("--accent",hex);
  r.setProperty("--a08","rgba("+rgb(hex)+",.08)");
  r.setProperty("--a20","rgba("+rgb(hex)+",.20)");
  r.setProperty("--a30","rgba("+rgb(hex)+",.30)");
  r.setProperty("--a55","rgba("+rgb(hex)+",.55)");
  document.querySelector('meta[name="theme-color"]').setAttribute("content","#05050c");
}

function freshDay(day){
  return PLAN[day].exercises.map(ex=>({ sets: ex.d.map(s=>({w:s.w,r:s.r,done:false})) }));
}
function loadDay(day){
  cur = day; setAccent(PLAN[day].accent);
  const saved = store.get(keyLast(day));
  if(saved){
    try{
      const parsed = JSON.parse(saved);
      work = PLAN[day].exercises.map((ex,i)=>{
        const src = parsed[i] && parsed[i].sets ? parsed[i].sets : ex.d.map(s=>({w:s.w,r:s.r}));
        return { sets: src.map(s=>({w:s.w??"", r:s.r??"", done:false})) };
      });
    }catch(e){ work = freshDay(day); }
  } else { work = freshDay(day); }
  render();
}

function volume(){
  let v=0; work.forEach(ex=>ex.sets.forEach(s=>{ v += num(s.w)*num(s.r); })); return v;
}

// ---------- render ----------
const $ = id => document.getElementById(id);

function render(){
  $("bar").style.display = view==="log" ? "flex" : "none";
  document.querySelectorAll(".nav").forEach(b=> b.classList.toggle("on", b.dataset.view===view));
  $("days").style.display = view==="log" ? "flex" : "none";
  if(view==="log") renderLog();
  if(view==="hist") renderHist();
  if(view==="prog") renderProg();
}

function renderLog(){
  $("title").innerHTML = cur.replace(" ","<br>").toUpperCase();
  const dt = store.get(keyDate(cur));
  $("sub").textContent = dt ? ("ZULETZT GELOGGT · "+dt) : "NOCH KEINE EINHEIT GESPEICHERT";
  $("volhead").textContent = "VOL "+fmt(volume())+" KG";

  const nav = $("days"); nav.innerHTML="";
  DAYS.forEach(d=>{
    const b=document.createElement("button");
    b.className="pill"+(d===cur?" on":"");
    b.textContent=d;
    if(d===cur){ b.style.background=PLAN[d].accent; b.style.boxShadow="0 0 22px "+PLAN[d].accent+"88"; }
    else { b.style.borderColor=PLAN[d].accent+"55"; b.style.color=PLAN[d].accent+"cc"; }
    b.onclick=()=>loadDay(d);
    nav.appendChild(b);
  });

  const m=$("main"); m.innerHTML="";
  PLAN[cur].exercises.forEach((ex,ei)=>{
    const anyDone = work[ei].sets.some(s=>s.done);
    const allDone = work[ei].sets.every(s=>s.done);
    const card=document.createElement("div");
    card.className="card"+(anyDone && !allDone ? " live" : "");
    card.innerHTML =
      '<div class="edge"></div>'+
      '<div class="ex-top"><span class="ex-idx">'+String(ei+1).padStart(2,"0")+'</span>'+
      '<span class="ex-name">'+ex.name+'</span></div>'+
      '<div class="chips">'+
        '<span class="chip hot">'+ex.sets+' Sätze</span>'+
        '<span class="chip hot">'+ex.reps+' Wdh</span>'+
        '<span class="chip">Pause '+ex.rest+' min</span>'+
        '<span class="chip">Warm-up '+ex.wu+'</span>'+
      '</div>';
    const sw=document.createElement("div"); sw.className="sets";
    work[ei].sets.forEach((s,si)=> sw.appendChild(setRow(ei,si,s)));
    card.appendChild(sw);
    const ctl=document.createElement("div"); ctl.className="setctl";
    ctl.innerHTML='<button class="add" data-add="'+ei+'">+ Satz</button>'+
      (work[ei].sets.length>1?'<button class="del" data-del="'+ei+'">− Satz</button>':'');
    card.appendChild(ctl);
    m.appendChild(card);
  });
  m.querySelectorAll("[data-add]").forEach(b=> b.onclick=()=>{ const i=+b.dataset.add;
    const last=work[i].sets[work[i].sets.length-1]||{w:"",r:""};
    work[i].sets.push({w:last.w,r:last.r,done:false}); renderLog(); });
  m.querySelectorAll("[data-del]").forEach(b=> b.onclick=()=>{ const i=+b.dataset.del;
    if(work[i].sets.length>1){ work[i].sets.pop(); renderLog(); } });
}

function setRow(ei,si,s){
  const row=document.createElement("div");
  row.className="set"+(s.done?"":" off");
  const n=document.createElement("span"); n.className="n"; n.textContent="S"+(si+1);
  const wIn=document.createElement("input");
  wIn.inputMode="decimal"; wIn.value=s.w; wIn.placeholder="kg";
  wIn.oninput=e=>{ work[ei].sets[si].w=e.target.value; $("volhead").textContent="VOL "+fmt(volume())+" KG"; };
  const x=document.createElement("span"); x.className="x"; x.textContent="×";
  const rIn=document.createElement("input");
  rIn.inputMode="numeric"; rIn.value=s.r; rIn.placeholder="Wdh";
  rIn.oninput=e=>{ work[ei].sets[si].r=e.target.value; $("volhead").textContent="VOL "+fmt(volume())+" KG"; };
  const dn=document.createElement("button");
  dn.className="done"+(s.done?" on":""); dn.textContent="✓";
  dn.onclick=()=>{ work[ei].sets[si].done=!work[ei].sets[si].done;
    row.classList.toggle("off"); dn.classList.toggle("on");
    if(work[ei].sets[si].done && navigator.vibrate) navigator.vibrate(15); };
  row.append(n,wIn,x,rIn,dn);
  return row;
}

// ---------- history ----------
function renderHist(){
  const h = hist();
  const now = new Date();
  $("title").innerHTML = "HISTORIE";
  $("sub").textContent = h.length ? (h.length+" EINHEITEN GESPEICHERT") : "NOCH NICHTS GELOGGT";
  $("volhead").textContent = h.length ? ("STREAK "+streak(h)) : "";
  const m=$("main");

  if(!h.length){
    m.innerHTML = '<div class="empty"><h3>NOCH KEINE DATEN</h3>'+
      '<p>Speichere deine erste Einheit — danach füllt sich das Raster Tag für Tag, in der Farbe des jeweiligen Trainingstags.</p></div>';
    return;
  }

  const y=now.getFullYear(), mo=now.getMonth();
  const first=new Date(y,mo,1);
  const offset=(first.getDay()+6)%7;
  const dim=new Date(y,mo+1,0).getDate();
  const byDay={};
  h.forEach(e=>{ const d=new Date(e.ts);
    if(d.getFullYear()===y && d.getMonth()===mo) byDay[d.getDate()]=e.day; });

  const months=["JANUAR","FEBRUAR","MÄRZ","APRIL","MAI","JUNI","JULI","AUGUST","SEPTEMBER","OKTOBER","NOVEMBER","DEZEMBER"];
  let html='<div class="shead" style="margin-top:6px">'+months[mo]+' '+y+'</div><div class="cal">';
  ["M","D","M","D","F","S","S"].forEach(w=> html+='<span class="wd">'+w+'</span>');
  for(let i=0;i<offset;i++) html+='<span class="cell"></span>';
  for(let d=1;d<=dim;d++){
    const day=byDay[d];
    const isToday = d===now.getDate();
    const st = day ? 'background:'+PLAN[day].accent+'d9;box-shadow:0 0 14px '+PLAN[day].accent+'80' : '';
    html+='<span class="cell'+(isToday?' today':'')+'" style="'+st+'"></span>';
  }
  html+='</div><div class="legend">';
  DAYS.forEach(d=> html+='<span><i style="background:'+PLAN[d].accent+'"></i>'+d.toUpperCase()+'</span>');
  html+='</div><div class="shead">LETZTE EINHEITEN</div>';
  h.slice(0,12).forEach(e=>{
    html+='<div class="srow"><span class="tag" style="background:'+PLAN[e.day].accent+
      ';box-shadow:0 0 12px '+PLAN[e.day].accent+'99"></span>'+
      '<div style="flex:1"><div class="nm">'+e.day+'</div>'+
      '<div class="mt">'+deDate(e.ts)+' · '+e.sets+' SÄTZE</div></div>'+
      '<div class="rt"><b>'+fmt(e.vol)+'</b><s>KG VOL</s></div></div>';
  });
  m.innerHTML=html;
}

function streak(h){
  const days = new Set(h.map(e=> new Date(e.ts).toDateString()));
  let n=0; const d=new Date();
  if(!days.has(d.toDateString())) d.setDate(d.getDate()-1);
  while(days.has(d.toDateString())){ n++; d.setDate(d.getDate()-1); }
  return n+" TAGE";
}

// ---------- progress ----------
function renderProg(){
  const h = hist();
  $("title").innerHTML = "FORTSCHRITT";
  const m=$("main");
  const names=[]; h.forEach(e=> e.ex.forEach(x=>{ if(!names.includes(x.name)) names.push(x.name); }));
  if(!names.length){
    $("sub").textContent="NOCH KEINE DATEN"; $("volhead").textContent="";
    m.innerHTML='<div class="empty"><h3>KEINE KURVE OHNE DATEN</h3>'+
      '<p>Sobald du dieselbe Übung zweimal geloggt hast, zeichnet Iron Log hier die Kurve deines besten Satzes.</p></div>';
    return;
  }
  if(!names.includes(progEx)) progEx = names[0];

  const series = h.filter(e=> e.ex.some(x=>x.name===progEx)).map(e=>{
    const ex = e.ex.find(x=>x.name===progEx);
    let best=0, bestR=0;
    ex.sets.forEach(s=>{ const w=num(s.w); if(w>best){ best=w; bestR=num(s.r); } });
    return { ts:e.ts, w:best, r:bestR };
  }).reverse();

  const last = series[series.length-1];
  const first = series[0];
  const delta = first.w ? ((last.w-first.w)/first.w*100) : 0;
  const e1rm = last.w*(1+last.r/30);
  const vol = h.filter(e=>e.ex.some(x=>x.name===progEx))
    .reduce((a,e)=> a + e.ex.find(x=>x.name===progEx).sets.reduce((b,s)=> b+num(s.w)*num(s.r),0), 0);

  $("sub").textContent = "BESTER SATZ · "+fmt(last.w)+" × "+last.r;
  $("volhead").textContent = fmt(last.w)+" KG";

  let html='<div class="days" style="padding:0;margin-top:4px">';
  names.forEach(n=>{
    const on = n===progEx;
    html+='<button class="pill'+(on?" on":"")+'" data-ex="'+n.replace(/"/g,"&quot;")+'"'+
      (on?' style="background:var(--accent);box-shadow:0 0 18px var(--a55)"':'')+'>'+n+'</button>';
  });
  html+='</div>';

  html+='<div style="display:flex;align-items:flex-end;justify-content:space-between;margin:22px 0 2px">'+
    '<div><div style="font-family:Michroma,sans-serif;font-size:15px;color:#eafcff;text-shadow:0 0 18px var(--a55)">'+
    fmt(last.w)+' KG</div><div class="sub" style="margin-top:6px">'+series.length+' EINHEITEN GELOGGT</div></div>'+
    '<div style="padding:5px 10px;border-radius:7px;background:rgba(45,255,176,.12);border:1px solid rgba(45,255,176,.4);color:#2dffb0;font:700 11px Inter,sans-serif">'+
    (delta>=0?"+":"")+fmt(delta)+' %</div></div>';

  html+='<div class="chartbox">'+chart(series)+'<div class="xax">'+
    (series.length>1 ? '<span>'+deDate(series[0].ts).slice(0,5)+'</span><span>'+deDate(last.ts).slice(0,5)+'</span>' : '<span>'+deDate(last.ts).slice(0,5)+'</span>')+
    '</div></div>';

  html+='<div class="stats">'+
    '<div class="stat"><b>'+fmt(e1rm)+'</b><s>E1RM KG</s></div>'+
    '<div class="stat"><b>'+series.length+'</b><s>EINHEITEN</s></div>'+
    '<div class="stat"><b>'+fmt(vol)+'</b><s>KG VOL</s></div></div>';

  html+='<div class="shead">SATZ-HISTORIE</div><div class="hlist">';
  h.filter(e=>e.ex.some(x=>x.name===progEx)).slice(0,8).forEach(e=>{
    const ex=e.ex.find(x=>x.name===progEx);
    const txt=ex.sets.filter(s=>s.w||s.r).map(s=>(s.w||"–")+" × "+(s.r||"–")).join(" · ");
    html+='<div class="hrow"><span>'+deDate(e.ts)+'</span><b>'+txt+'</b></div>';
  });
  html+='</div>';

  m.innerHTML=html;
  m.querySelectorAll("[data-ex]").forEach(b=> b.onclick=()=>{ progEx=b.dataset.ex; renderProg(); });
}

function chart(series){
  const W=348,H=160,PADX=10,TOP=20,BOT=140;
  if(series.length<2){
    return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:160px;display:block">'+
      '<text x="'+(W/2)+'" y="'+(H/2)+'" text-anchor="middle" fill="#4f5680" '+
      'font-family="ui-monospace,Menlo,monospace" font-size="11" letter-spacing="2">MIN. 2 EINHEITEN NÖTIG</text></svg>';
  }
  const ws=series.map(s=>s.w);
  let lo=Math.min(...ws), hi=Math.max(...ws);
  if(hi===lo){ hi=lo+1; lo=Math.max(0,lo-1); }
  const x=i=> PADX + i*((W-2*PADX)/(series.length-1));
  const y=w=> BOT - ((w-lo)/(hi-lo))*(BOT-TOP);
  const pts=series.map((s,i)=> x(i).toFixed(1)+","+y(s.w).toFixed(1)).join(" ");
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:160px;display:block">'+
    '<defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="var(--accent)" stop-opacity="0.35"/>'+
    '<stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient>'+
    '<linearGradient id="line" x1="0" y1="0" x2="1" y2="0">'+
    '<stop offset="0%" stop-color="#ff2d95"/><stop offset="100%" stop-color="var(--accent)"/></linearGradient></defs>'+
    '<line x1="0" y1="38" x2="'+W+'" y2="38" stroke="rgba(120,140,200,.12)"/>'+
    '<line x1="0" y1="80" x2="'+W+'" y2="80" stroke="rgba(120,140,200,.12)"/>'+
    '<line x1="0" y1="122" x2="'+W+'" y2="122" stroke="rgba(120,140,200,.12)"/>'+
    '<polygon points="'+pts+' '+x(series.length-1).toFixed(1)+',150 '+PADX+',150" fill="url(#area)"/>'+
    '<polyline points="'+pts+'" fill="none" stroke="url(#line)" stroke-width="2.5" '+
    'stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 8px var(--a55))"/>'+
    '<circle cx="'+x(series.length-1).toFixed(1)+'" cy="'+y(series[series.length-1].w).toFixed(1)+
    '" r="5" fill="var(--accent)" style="filter:drop-shadow(0 0 10px var(--accent))"/></svg>';
}

// ---------- nav ----------
document.querySelectorAll(".nav").forEach(b=> b.onclick=()=>{
  view=b.dataset.view; window.scrollTo(0,0); render(); });

// ---------- save ----------
$("saveBtn").onclick=()=>{
  const payload = work.map(ex=>({ sets: ex.sets.map(s=>({w:s.w,r:s.r})) }));
  const today = new Date();
  store.set(keyLast(cur), JSON.stringify(payload));
  store.set(keyDate(cur), deDate(today.toISOString()));
  let count=0;
  work.forEach(ex=> ex.sets.forEach(s=>{ if(num(s.w)||num(s.r)) count++; }));
  pushHist({
    ts: today.toISOString(), day: cur, vol: volume(), sets: count,
    ex: PLAN[cur].exercises.map((ex,i)=>({ name: ex.name,
      sets: work[i].sets.map(s=>({w:s.w,r:s.r})) })),
  });
  work.forEach(ex=>ex.sets.forEach(s=>s.done=false));
  renderLog();
  toast("Einheit gespeichert");
  if(navigator.vibrate) navigator.vibrate([20,40,20]);
};
function toast(msg){ const t=$("toast"); t.textContent=msg;
  t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1700); }

// ---------- rest timer ----------
const veil=$("veil"), presetsEl=$("presets"), ringWrap=$("ringWrap"), ringFg=$("ringFg"),
      ringTime=$("ringTime"), ringLbl=$("ringLbl"), ringAdj=$("ringAdj"), restHint=$("restHint");
const CIRC=2*Math.PI*52; ringFg.style.strokeDasharray=CIRC;
let tmr=null, tEnd=0, tTotal=0, audioCtx=null;
[60,90,120,150,180].forEach(sec=>{ const b=document.createElement("button");
  b.className="preset"; b.textContent=(sec/60).toString().replace(/\.5/,"½")+" min";
  b.onclick=()=>startTimer(sec); presetsEl.appendChild(b); });
$("restBtn").onclick=()=>{ veil.classList.add("show"); presetsEl.style.display="flex";
  ringWrap.classList.remove("show"); ringAdj.classList.remove("show");
  restHint.textContent="PAUSENZEIT WÄHLEN"; ensureAudio(); };
$("restClose").onclick=closeTimer;
function ensureAudio(){ try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function startTimer(sec){ tTotal=sec; tEnd=Date.now()+sec*1000;
  presetsEl.style.display="none"; ringWrap.classList.add("show"); ringAdj.classList.add("show");
  ringLbl.textContent="PAUSE LÄUFT"; restHint.textContent="NÄCHSTER SATZ WARTET";
  tick(); clearInterval(tmr); tmr=setInterval(tick,250); }
function tick(){ const left=Math.max(0,tEnd-Date.now())/1000; const s=Math.ceil(left);
  ringTime.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  ringFg.style.strokeDashoffset=CIRC*(1-left/tTotal);
  if(left<=0){ clearInterval(tmr); finish(); } }
function finish(){ ringTime.textContent="LOS!"; ringLbl.textContent="PAUSE VORBEI";
  if(navigator.vibrate) navigator.vibrate([120,60,120]); beep();
  restHint.textContent=""; setTimeout(closeTimer,1400); }
function beep(){ try{ ensureAudio(); if(!audioCtx) return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination); o.type="sine"; o.frequency.value=880;
  g.gain.setValueAtTime(.001,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.4,audioCtx.currentTime+.03);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.5);
  o.start(); o.stop(audioCtx.currentTime+.5);}catch(e){} }
ringAdj.onclick=e=>{ const a=e.target.dataset.adj; if(!a) return;
  if(a==="stop"){ clearInterval(tmr); closeTimer(); return; }
  tEnd+=(+a)*1000; tTotal=Math.max(1,tTotal+(+a)); tick(); };
function closeTimer(){ clearInterval(tmr); veil.classList.remove("show"); }

// ---------- go ----------
loadDay(DAYS[0]);
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
